classes:
  UpdateInfo:
    description: Specific type of information that was updated for this
      dataset.
    attributes:
      date:
        description: Date of the update.
        slot_uri: nl:UpdateInfo.date
        range: date
        required: true
        multivalued: false
      type:
        description: Type of the update.
        slot_uri: nl:UpdateInfo.type
        range: UpdateInfoKind
        required: true
        multivalued: false
    class_uri: nl:UpdateInfo
  Measurement:
    description: |-
      A Measurement represents any measured, calculated or non-measured
      non-calculated quantity. Any piece of equipment may contain Measurements,
      e.g. a substation may have temperature measurements and door open
      indications, a transformer may have oil temperature and tank pressure
      measurements, a bay may contain a number of power flow measurements and a
      Breaker may contain a switch status measurement.

      The PSR - Measurement association is intended to capture this use of
      Measurement and is included in the naming hierarchy based on
      EquipmentContainer. The naming hierarchy typically has Measurements as
      leaves, e.g. Substation-VoltageLevel-Bay-Switch-Measurement.

      Some Measurements represent quantities related to a particular sensor
      location in the network, e.g. a voltage transformer (VT) or potential
      transformer (PT) at a busbar or a current transformer (CT) at the bar
      between a breaker and an isolator.  The sensing position is not captured
      in the PSR - Measurement association.  Instead it is captured by the
      Measurement - Terminal association that is used to define the sensing
      location in the network topology. The location is defined by the
      connection of the Terminal to ConductingEquipment.

      If both a Terminal and PSR are associated, and the PSR is of type
      ConductingEquipment, the associated Terminal should belong to that
      ConductingEquipment instance.

      When the sensor location is needed both Measurement-PSR and
      Measurement-Terminal are used. The Measurement-Terminal association is
      never used alone.
    from_schema: https://cim.ucaiug.io/ns#TC57CIM.IEC61970.Base.Meas
    is_a: IdentifiedObject
    attributes:
      measurementType:
        slot_uri: cim:Measurement.measurementType
        range: MeasurementKind
        required: false
        multivalued: false
        description: "Specifies the type of measurement.  For example, this specifies\
          \ if the measurement represents an indoor temperature, outdoor temperature,\
          \ bus voltage, line flow, etc.\r\nWhen the measurementType is set to \"\
          Specialization\", the type of Measurement is defined in more detail by the\
          \ specialized class which inherits from Measurement.\r\n\r\n"
      unitMultiplier:
        description: The unit multiplier of the measured quantity.
        slot_uri: cim:Measurement.unitMultiplier
        range: UnitMultiplier
        required: true
        multivalued: false
      unitSymbol:
        description: The unit of measure of the measured quantity.
        slot_uri: cim:Measurement.unitSymbol
        range: UnitSymbol
        required: true
        multivalued: false
      Terminal:
        description: One or more measurements may be associated with a terminal in
          the network.
        slot_uri: cim:Measurement.Terminal
        range: curie
        required: false
        multivalued: false
      PowerSystemResource:
        description: The power system resource that contains the measurement.
        slot_uri: cim:Measurement.PowerSystemResource
        range: curie
        required: false
        multivalued: false
      SeriesEquipmentDependentLimit:
        slot_uri: nl:Measurement.SeriesEquipmentDependentLimit
        range: curie
        required: false
        multivalued: false
        description: Measurement which applies to all contained Equipment-s.
    class_uri: cim:Measurement
    tree_root: true
  IdentifiedObject:
    description: This is a root class to provide common identification for all classes
      needing identification and naming attributes.
    from_schema: https://cim.ucaiug.io/ns#TC57CIM.IEC61970.Base.Core
    attributes:
      description:
        description: The description is a free human readable text describing or naming
          the object. It may be non unique and may not correlate to a naming hierarchy.
        slot_uri: cim:IdentifiedObject.description
        range: string
        required: false
        multivalued: false
      mRID:
        description: "Master resource identifier issued by a model authority. The\
          \ mRID is unique within an exchange context. Global uniqueness is easily\
          \ achieved by using a UUID, as specified in RFC 4122, for the mRID. The\
          \ use of UUID is strongly recommended.\r\nFor CIMXML data files in RDF syntax\
          \ conforming to IEC 61970-552, the mRID is mapped to rdf:ID or rdf:about\
          \ attributes that identify CIM object elements."
        slot_uri: cim:IdentifiedObject.mRID
        range: string
        identifier: true
        required: true
        multivalued: false
      name:
        description: "The name is any free human readable and possibly non unique\
          \ text naming the object.\r\n"
        slot_uri: cim:IdentifiedObject.name
        range: string
        required: false
        multivalued: false
    class_uri: cim:IdentifiedObject
  Analog:
    description: "Analog represents an analog Measurement.\r\n"
    from_schema: https://cim.ucaiug.io/ns#TC57CIM.IEC61970.Base.Meas
    is_a: Measurement
    attributes:
      positiveFlowIn:
        description: If true then this measurement is an active power, reactive power
          or current with the convention that a positive value measured at the Terminal
          means power is flowing into the related PowerSystemResource.
        slot_uri: cim:Analog.positiveFlowIn
        range: boolean
        required: false
        multivalued: false
    exact_mappings:
    - nbnl-term:7bs28
    - nbnl-term:7n44w
    class_uri: cim:Analog
  AnalogValue:
    description: AnalogValue represents an analog MeasurementValue.
    from_schema: https://cim.ucaiug.io/ns#TC57CIM.IEC61970.Base.Meas
    is_a: MeasurementValue
    attributes:
      value:
        description: The value to supervise.
        slot_uri: cim:AnalogValue.value
        range: float
        required: false
        multivalued: false
      Analog:
        description: Measurement to which this value is connected.
        slot_uri: cim:AnalogValue.Analog
        range: Analog
        required: true
        multivalued: false
    class_uri: cim:AnalogValue
  MeasurementValue:
    description: "The current state for a measurement. A state value is an instance\
      \ of a measurement from a specific source. Measurements can be associated with\
      \ many state values, each representing a different source for the measurement.\r\
      \n"
    from_schema: https://cim.ucaiug.io/ns#TC57CIM.IEC61970.Base.Meas
    is_a: IOPoint
    attributes:
      timeStamp:
        description: The time when the value was last updated.
        slot_uri: cim:MeasurementValue.timeStamp
        range: datetime
        required: false
        multivalued: false
    class_uri: cim:MeasurementValue
  IOPoint:
    description: The class describe a measurement or control value. The purpose is
      to enable having attributes and associations common for measurement and control.
    from_schema: https://cim.ucaiug.io/ns#TC57CIM.IEC61970.Base.Meas
    is_a: IdentifiedObject
    class_uri: cim:IOPoint
  Queue:
    description:
      Waiting queue information associated with a cim:ReportingGroup from EQ.
    is_a: IdentifiedObject
    attributes:
      requests:
        description:
          Number of requests for new grid connections and capacity increases in
          queue.
        slot_uri: nl:Queue.requests
        range: integer
        required: false
        multivalued: false
        exact_mappings:
        - ck:EnergyArea.demand_requests_in_queue
        - ck:EnergyArea.generation_requests_in_queue
      capacity:
        description: The requested capacity for the combined requests.
        slot_uri: nl:Queue.capacity
        range: ActivePower
        required: false
        multivalued: false
        exact_mappings:
        - ck:EnergyArea.demand_capacity_in_queue
        - ck:EnergyArea.generation_capacity_in_queue
      ReportingGroup:
        slot_uri: nl:Queue.ReportingGroup
        range: curie
        required: true
        multivalued: true
        description: Reporting groups to which this queue belongs.
      direction:
        slot_uri: nl:Queue.direction
        range: InterTieDirection
        required: false
        multivalued: false
        description: "The direction of the queue, export or import"
    exact_mappings:
    - vocab:wachtrij
    class_uri: nl:Queue
  ActivePower:
    annotations:
      represents_cim_data_type:
        tag: represents_cim_data_type
        value: true
    description: Product of RMS value of the voltage and the RMS value of the in-phase
      component of the current.
    from_schema: https://cim.ucaiug.io/ns#TC57CIM.IEC61970.Base.Domain
    attributes:
      multiplier:
        slot_uri: cim:ActivePower.multiplier
        range: UnitMultiplier
        required: true
        multivalued: false
      unit:
        slot_uri: cim:ActivePower.unit
        range: UnitSymbol
        required: true
        multivalued: false
      value:
        slot_uri: cim:ActivePower.value
        range: float
        required: true
        multivalued: false
    class_uri: cim:ActivePower
